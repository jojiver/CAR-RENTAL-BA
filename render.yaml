services:
  - type: web
    name: rove-car-rental
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
