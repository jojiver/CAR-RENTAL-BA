services:
  postgres:
    image: postgres:16-alpine
    container_name: rove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rove
    ports:
      - "5432:5432"
    volumes:
      - rove-pgdata:/var/lib/postgresql/data

volumes:
  rove-pgdata:
